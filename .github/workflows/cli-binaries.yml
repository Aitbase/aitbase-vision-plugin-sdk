# Cross-compiles the aitbase-plugin CLI. Used by ci.yml and release.yml so both build the same way.
name: cli-binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Cross-compile the CLI
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "dist/aitbase-plugin-$os-$arch$ext" ./cmd/aitbase-plugin
          done
          (cd dist && sha256sum aitbase-plugin-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Smoke-test the Linux binary
        run: |
          dist/aitbase-plugin-linux-amd64 version
          dist/aitbase-plugin-linux-amd64 init "$RUNNER_TEMP/smoke" --id ci.smoke --json > /dev/null
          dist/aitbase-plugin-linux-amd64 check "$RUNNER_TEMP/smoke" --skip-ui --json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: aitbase-plugin
          path: dist/
          if-no-files-found: error
