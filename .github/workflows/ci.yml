name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Init, check and pack a project
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/aitbase-plugin" ./cmd/aitbase-plugin
          cd "$RUNNER_TEMP"
          ./aitbase-plugin init demo --id ci.demo --json
          ./aitbase-plugin check demo --json
      - name: Build and pack (POSIX runtime)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/demo"
          ../aitbase-plugin build --json
          ../aitbase-plugin pack --json > first.json
          rm -rf dist && ../aitbase-plugin pack --json > second.json
          python3 -c 'import json,sys; a,b=(json.load(open(f))["sha256"] for f in sys.argv[1:]); sys.exit(a!=b)' first.json second.json

  release-binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Cross-compile the CLI
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/aitbase-plugin-$os-$arch$ext" ./cmd/aitbase-plugin
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: aitbase-plugin
          path: dist/
